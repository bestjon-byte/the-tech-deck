<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="felt" cx="50%" cy="36%" r="75%">
      <stop offset="0%" stop-color="#2f9160"/>
      <stop offset="48%" stop-color="#1a5c38"/>
      <stop offset="100%" stop-color="#062012"/>
    </radialGradient>
    <!-- A spade, centred on the origin, about 100 units tall -->
    <path id="spade" d="M0,-46 C14,-22 46,-14 46,12 C46,30 30,40 16,32 C18,42 26,50 36,54 L-36,54 C-26,50 -18,42 -16,32 C-30,40 -46,30 -46,12 C-46,-14 -14,-22 0,-46 Z"/>
  </defs>

  <!-- Felt background (full bleed so iOS can round the corners itself) -->
  <rect width="512" height="512" fill="url(#felt)"/>

  <!-- Two cards peeking behind, fanned left and right -->
  <g transform="translate(196 278) rotate(-17)">
    <rect x="-82" y="-116" width="164" height="232" rx="20" fill="#000" opacity="0.22" transform="translate(5 9)"/>
    <rect x="-82" y="-116" width="164" height="232" rx="20" fill="#eaf0f6" stroke="#cdd6e2" stroke-width="2"/>
  </g>
  <g transform="translate(316 278) rotate(17)">
    <rect x="-82" y="-116" width="164" height="232" rx="20" fill="#000" opacity="0.22" transform="translate(5 9)"/>
    <rect x="-82" y="-116" width="164" height="232" rx="20" fill="#eaf0f6" stroke="#cdd6e2" stroke-width="2"/>
  </g>

  <!-- Front card, upright, an ace-of-spades look -->
  <g transform="translate(256 290)">
    <rect x="-86" y="-122" width="172" height="244" rx="22" fill="#000" opacity="0.28" transform="translate(6 12)"/>
    <rect x="-86" y="-122" width="172" height="244" rx="22" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
    <use href="#spade" transform="translate(0 6) scale(1.02)" fill="#11161f"/>
    <use href="#spade" transform="translate(-62 -86) scale(0.26)" fill="#11161f"/>
    <use href="#spade" transform="translate(62 86) scale(0.26) rotate(180)" fill="#11161f"/>
  </g>
</svg>
